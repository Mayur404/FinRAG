[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finpaper"
version = "0.1.0"
description = "FinanceBench report question answering with five RAG methods and a local web workspace"
requires-python = ">=3.10"
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
docling = ["docling[onnxruntime]>=2.0"]
baseline = ["unstructured[pdf]>=0.15.0"]
neural = ["numpy>=1.26", "sentence-transformers>=5.0", "rank-bm25>=0.2.2", "torch>=2.9,<2.10"]

[project.scripts]
finpaper = "improvement1.app:main"
finpaper-ui = "finpaper.web:main"

[tool.setuptools.packages.find]
include = ["finpaper*", "baseline*", "improvement1*", "improvement2*", "improvement3*", "improvement4*"]

[tool.setuptools.package-data]
finpaper = ["static/*.html", "static/*.css", "static/*.js"]
